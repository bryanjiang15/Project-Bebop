name: Build and Test

on:
  push:
    branches:
      - 'cursor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and Build macOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Godot 4.7
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          sudo mv Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Download export templates
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          unzip -q Godot_v4.7-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.7.stable
          mv ~/.local/share/godot/export_templates/4.7.stable/templates/* ~/.local/share/godot/export_templates/4.7.stable/
          rmdir ~/.local/share/godot/export_templates/4.7.stable/templates

      - name: Import project
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|^ERROR:" import.log; then
            echo "Import produced errors"
            exit 1
          fi

      - name: Run unit tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee test_unit.log
          if grep -E "SCRIPT ERROR|^ERROR:" test_unit.log; then
            echo "Unit tests produced errors"
            exit 1
          fi

      - name: Missing config key aborts
        run: |
          set -o pipefail
          set +e
          godot --headless --path . --script res://tests/expect_missing_key.gd 2>&1 | tee test_missing.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Missing-key loader exited 0"
            exit 1
          fi
          if ! grep -q "game_config.json missing key: players.count" test_missing.log; then
            echo "Missing-key loader did not name the key"
            exit 1
          fi
          if grep -E "SCRIPT ERROR" test_missing.log; then
            echo "Missing-key run had a script error"
            exit 1
          fi
          if grep -E "^ERROR:" test_missing.log | grep -v "game_config.json missing key"; then
            echo "Missing-key run had an unexpected error"
            exit 1
          fi

      - name: Run main menu headless
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 120 res://scenes/main_menu.tscn 2>&1 | tee scene_menu.log
          if grep -E "SCRIPT ERROR|^ERROR:" scene_menu.log; then
            echo "Main menu produced errors"
            exit 1
          fi

      - name: Run in-game scene headless
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 120 res://scenes/game.tscn 2>&1 | tee scene_game.log
          if grep -E "SCRIPT ERROR|^ERROR:" scene_game.log; then
            echo "In-game scene produced errors"
            exit 1
          fi

      - name: Run smoke test
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/smoke_game.gd 2>&1 | tee test_smoke.log
          if grep -E "SCRIPT ERROR|^ERROR:" test_smoke.log; then
            echo "Smoke test produced errors"
            exit 1
          fi
          if ! grep -q "SMOKE OK" test_smoke.log; then
            echo "Smoke test did not finish"
            exit 1
          fi

      - name: Run game-log smoke test
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/smoke_log.gd 2>&1 | tee test_smoke_log.log
          if grep -E "SCRIPT ERROR|^ERROR:" test_smoke_log.log; then
            echo "Game-log smoke produced errors"
            exit 1
          fi
          if ! grep -q "SMOKE LOG OK" test_smoke_log.log; then
            echo "Game-log smoke did not finish"
            exit 1
          fi

      - name: Export macOS build
        run: |
          set -o pipefail
          mkdir -p builds
          godot --headless --path . --export-release "macOS" builds/bebop_macos_4.7.zip 2>&1 | tee export.log
          if grep -E "SCRIPT ERROR|^ERROR:" export.log; then
            echo "Export produced errors"
            exit 1
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: bebop-macos-4.7
          path: builds/bebop_macos_4.7.zip
          retention-days: 30
