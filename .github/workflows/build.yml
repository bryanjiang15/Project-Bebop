name: Build and Test

on:
  push:
    branches:
      - 'cursor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and Build macOS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Godot 4.7
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          sudo mv Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      
      - name: Download export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          unzip -q Godot_v4.7-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.7.stable
          mv ~/.local/share/godot/export_templates/4.7.stable/templates/* ~/.local/share/godot/export_templates/4.7.stable/
          rmdir ~/.local/share/godot/export_templates/4.7.stable/templates
      
      - name: Initialize Godot project
        run: |
          godot --headless --editor --quit
      
      - name: Run unit tests
        run: |
          godot --headless --script tests/run_tests_simple.gd 2>&1 | tee test_unit.log
          if [ $? -ne 0 ]; then
            echo "Unit tests failed with non-zero exit code"
            exit 1
          fi
          if grep -E "SCRIPT ERROR|^ERROR:" test_unit.log; then
            echo "Unit tests produced errors"
            exit 1
          fi
          echo "✓ Unit tests passed"
      
      - name: Run playability tests
        run: |
          godot --headless --script tests/verify_e1_playable.gd 2>&1 | tee test_playable.log
          if [ $? -ne 0 ]; then
            echo "Playability tests failed with non-zero exit code"
            exit 1
          fi
          if grep -E "SCRIPT ERROR|^ERROR:" test_playable.log; then
            echo "Playability tests produced errors"
            exit 1
          fi
          echo "✓ Playability tests passed"
      
      - name: Run combat scene smoke test
        run: |
          timeout 10 godot --headless --quit-after 80 res://tests/test_combat_scene_smoke.tscn 2>&1 | tee test_smoke.log
          if [ $? -ne 0 ]; then
            echo "Smoke test failed with non-zero exit code"
            exit 1
          fi
          if grep -E "SCRIPT ERROR|^ERROR:" test_smoke.log; then
            echo "Smoke test produced errors"
            exit 1
          fi
          echo "✓ Combat scene smoke test passed"
      
      - name: Verify main scene loads without errors
        run: |
          timeout 10 godot --headless --quit-after 120 res://scenes/combat/combat_scene.tscn 2>&1 | tee scene_load.log
          if [ $? -gt 1 ]; then
            echo "Scene load failed or timed out"
            exit 1
          fi
          if grep -E "SCRIPT ERROR|^ERROR:" scene_load.log; then
            echo "Scene load produced errors"
            exit 1
          fi
          echo "✓ Main scene loads cleanly"
      
      - name: Export macOS build
        run: |
          mkdir -p builds
          godot --headless --export-release "macOS" builds/bebop_macos_4.7.zip
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: bebop-macos-4.7
          path: builds/bebop_macos_4.7.zip
          retention-days: 30
